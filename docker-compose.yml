version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sweety-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sweety
    ports:
      - '5432:5432'
    volumes:
      - sweety-data:/var/lib/postgresql/data

volumes:
  sweety-data:
